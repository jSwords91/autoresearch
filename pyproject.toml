[project]
name = "autoresearch-compress"
version = "0.1.0"
description = "Autonomous post-training compression research swarm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.1.0",
    "bitsandbytes>=0.44.1",
    "datasets>=3.1.0",
    "huggingface-hub>=0.26.0",
    "numpy>=2.2.6",
    "safetensors>=0.4.5",
    "transformers>=4.46.0",
    "torch==2.9.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
